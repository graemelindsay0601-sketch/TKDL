services:
  # ── Node.js web app + API (Card Clash ready) ───────────────────────────────
  - type: web
    name: tkdl
    runtime: node
    region: oregon
    buildCommand: pnpm install && pnpm --filter @workspace/tkdl run build && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Web push (see artifacts/api-server/src/app.ts) — without these three,
      # app.ts logs "VAPID keys not configured" at boot and every push send
      # silently no-ops, which is why push notifications have never actually
      # gone out despite the rest of the pipeline working. Generate a keypair
      # with `npx web-push generate-vapid-keys` and set the values in the
      # Render dashboard (Environment tab) — sync: false keeps the actual
      # secret out of this file.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
